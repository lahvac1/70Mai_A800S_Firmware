<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashcam{% endblock %} · Dashcam upload</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
{% if user %}
<header class="top">
  <a class="brand" href="/">Dashcam upload</a>
  <nav>
    <a href="/">Kamery</a>
    {% if user.role == 'admin' %}<a href="/users">Uživatelé</a><a href="/settings">Nastavení</a><a href="/audit">Log</a>{% endif %}
    <a href="/account">{{ user.username }}</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link">Odhlásit</button>
    </form>
  </nav>
</header>
{% endif %}
<main>
  {% if flash %}<div class="flash">{{ flash }}</div>{% endif %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
